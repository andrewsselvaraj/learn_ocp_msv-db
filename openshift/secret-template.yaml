# TEMPLATE ONLY. Do not put real values in this file and commit it.
#
# Easiest is to skip this file and create the Secret from the command line
# (single quotes stop the shell from mangling special characters like @ and #):
#
#   oc create secret generic db-console-secret \
#     --from-literal=DB_USERNAME='<your-db-username>' \
#     --from-literal=DB_PASSWORD='<your-db-password>'
#
# If you prefer YAML, copy this to openshift/db-console-secret.local.yaml
# (git-ignored), fill in the values, and `oc apply -f` that copy.
apiVersion: v1
kind: Secret
metadata:
  name: db-console-secret
  labels:
    app: db-console
type: Opaque
stringData:
  DB_USERNAME: "<your-db-username>"
  DB_PASSWORD: "<your-db-password>"
