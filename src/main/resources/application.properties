spring.application.name=db-console
server.port=8080

# ---------------------------------------------------------------------------
# Database connection
#
# Nothing here is a real credential. Every value is read from an environment
# variable. On OpenShift those variables come from:
#   DB_HOST, DB_PORT, DB_NAME   -> ConfigMap  "db-console-config"
#   DB_USERNAME, DB_PASSWORD    -> Secret     "db-console-secret"
# See openshift/deployment.yaml and README.md.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ocp_connect}?connectTimeout=5000&socketTimeout=60000&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP connection pool: small pool, fail fast so errors show up on the page quickly.
spring.datasource.hikari.pool-name=db-console-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
# Don't refuse to start when the DB is unreachable; the page will show the error instead.
spring.datasource.hikari.initialization-fail-timeout=-1

# Limits for the query console
console.max-rows=500
console.query-timeout-seconds=30

# ---------------------------------------------------------------------------
# Health endpoints for OpenShift probes
#   /actuator/health/liveness  -> is the JVM alive?
#   /actuator/health/readiness -> can the pod receive traffic?
# The DB is deliberately NOT part of readiness, so a DB outage does not take
# the console itself offline (you still want to see the error message).
# Full health incl. DB: /actuator/health
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
